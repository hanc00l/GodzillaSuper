\u5df2\u5f00\u59cb\u5b58\u6d3b\u68c0\u6d4b=\u0053\u0075\u0072\u0076\u0069\u0076\u0061\u006c\u0020\u0064\u0065\u0074\u0065\u0063\u0074\u0069\u006f\u006e\u0020\u0068\u0061\u0073\u0020\u0062\u0065\u0065\u006e\u0020\u0073\u0074\u0061\u0072\u0074\u0065\u0064
\u5982\u679c\u7f16\u8bd1\u51fa\u73b0\u4f9d\u8d56\u9519\u8bef\u0020\u8bf7\u624b\u52a8\u7f16\u8bd1\u6210\u0044\u004c\u004c\u7136\u540e\u4f7f\u7528\u0052\u0075\u006e\u0020\u0043\u0023\u0020\u0044\u004c\u004c\u529f\u80fd=\u0049\u0066\u0020\u0074\u0068\u0065\u0072\u0065\u0020\u0069\u0073\u0020\u0061\u0020\u0064\u0065\u0070\u0065\u006e\u0064\u0065\u006e\u0063\u0079\u0020\u0065\u0072\u0072\u006f\u0072\u0020\u0069\u006e\u0020\u0074\u0068\u0065\u0020\u0063\u006f\u006d\u0070\u0069\u006c\u0061\u0074\u0069\u006f\u006e\u0020\u0050\u006c\u0065\u0061\u0073\u0065\u0020\u0063\u006f\u006d\u0070\u0069\u006c\u0065\u0020\u006d\u0061\u006e\u0075\u0061\u006c\u006c\u0079\u0020\u0061\u0073\u0020\u0061\u0020\u0044\u004c\u004c\u0020\u0061\u006e\u0064\u0020\u0075\u0073\u0065\u0020\u0074\u0068\u0065\u0020\u0052\u0075\u006e\u0020\u0043\u0023\u0020\u0044\u004c\u004c\u0020\u0066\u0075\u006e\u0063\u0074\u0069\u006f\u006e
\u626b\u63cf\u0054\u006f\u006b\u0065\u006e\u65f6\u53d1\u751f\u9519\u8bef\u0020\u4e0d\u652f\u6301\u7684\u64cd\u4f5c\u0020\u003a\u0025\u0073=\u0041\u006e\u0020\u0065\u0072\u0072\u006f\u0072\u0020\u006f\u0063\u0063\u0075\u0072\u0072\u0065\u0064\u0020\u0077\u0068\u0069\u006c\u0065\u0020\u0073\u0063\u0061\u006e\u006e\u0069\u006e\u0067\u0020\u0066\u006f\u0072\u0020\u0054\u006f\u006b\u0065\u006e\u0073\u0020\u0055\u006e\u0073\u0075\u0070\u0070\u006f\u0072\u0074\u0065\u0064\u0020\u006f\u0070\u0065\u0072\u0061\u0074\u0069\u006f\u006e\u0020\u003a\u0025\u0073
\u4e0d\u540c\u610f=\u0044\u0069\u0073\u0061\u0067\u0072\u0065\u0065
