\u002e\u004e\u0045\u0054\u53ef\u6267\u884c\u7a0b\u5e8f\u96c6\u8def\u5f84\u0028\u53ef\u62d6\u62fd\u0029\u003a=\u004e\u0045\u0054\u0020\u0065\u0078\u0065\u0063\u0075\u0074\u0061\u0062\u006c\u0065\u0020\u0061\u0073\u0073\u0065\u006d\u0062\u006c\u0079\u0020\u0070\u0061\u0074\u0068\u0020\u0028\u0064\u0072\u0061\u0067\u0067\u0061\u0062\u006c\u0065\u0029\u003a
\u5171\u0025\u0064\u4e2a\u0056\u0069\u0072\u0074\u0075\u0061\u006c\u004d\u0061\u0063\u0068\u0069\u006e\u0065\u005c\u0072\u005c\u006e=\u0054\u006f\u0074\u0061\u006c\u0020\u0025\u0064\u0020\u0056\u0069\u0072\u0074\u0075\u0061\u006c\u004d\u0061\u0063\u0068\u0069\u006e\u0065\u005c\u0072\u005c\u006e
\u5fc3\u8df3\u5305\u6296\u52a8\u0020\u53d6\u503c\u8303\u56f4\u005b\u0030\u002d\u0039\u0039\u005d\u0028\u767e\u5206\u6bd4\u0029\u005c\u006e\u54e5\u65af\u62c9\u5c06\u6309\u7167\u4f60\u6307\u5b9a\u7684\u5fc3\u8df3\u5305\u5ef6\u8fdf\u7684\u968f\u673a\u767e\u5206\u6bd4\u6765\u6539\u53d8\u5b83\u7684\u6bcf\u4e2a\u5fc3\u8df3\u65f6\u95f4\u002e\u4f8b\u5982\u002c\u0068\u0065\u0061\u0072\u0074\u0062\u0065\u0061\u0074\u0053\u006c\u0065\u0065\u0070\u0054\u0069\u006d\u0065\u003d\u0033\u0030\u0030\u0030\u002c\u0068\u0065\u0061\u0072\u0074\u0062\u0065\u0061\u0074\u004a\u0069\u0074\u0074\u0065\u0072\u003d\u0032\u0030\u0020\u5c06\u8feb\u4f7f\u54e5\u65af\u62c9\u4ee5\u0032\u0030\u0025\u7684\u6296\u52a8\u767e\u5206\u6bd4\u7761\u7720\u0033\u0030\u0030\u0030\u6beb\u79d2\u002e\u8fd9\u610f\u5473\u7740\u54e5\u65af\u62c9\u5c06\u5728\u6bcf\u6b21\u5fc3\u8df3\u540e\u7761\u7720\u0032\u0034\u0030\u0030\u006d\u0073\u5230\u0033\u0030\u0030\u0030\u006d\u0073\u4e4b\u95f4\u7684\u968f\u673a\u503c\u002e=\u0048\u0065\u0061\u0072\u0074\u0062\u0065\u0061\u0074\u0020\u0070\u0061\u0063\u006b\u0065\u0074\u0020\u006a\u0069\u0074\u0074\u0065\u0072\u0020\u0052\u0061\u006e\u0067\u0065\u0020\u005b\u0030\u002d\u0039\u0039\u005d\u0020\u0028\u0070\u0065\u0072\u0063\u0065\u006e\u0074\u0061\u0067\u0065\u0029\u005c\u006e\u0020\u0047\u006f\u0064\u007a\u0069\u006c\u006c\u0061\u0020\u0077\u0069\u006c\u006c\u0020\u0063\u0068\u0061\u006e\u0067\u0065\u0020\u0069\u0074\u0073\u0020\u0068\u0065\u0061\u0072\u0074\u0062\u0065\u0061\u0074\u0020\u0074\u0069\u006d\u0065\u0020\u0066\u006f\u0072\u0020\u0065\u0061\u0063\u0068\u0020\u0068\u0065\u0061\u0072\u0074\u0062\u0065\u0061\u0074\u0020\u0070\u0061\u0063\u006b\u0065\u0074\u0020\u0061\u0063\u0063\u006f\u0072\u0064\u0069\u006e\u0067\u0020\u0074\u006f\u0020\u0061\u0020\u0072\u0061\u006e\u0064\u006f\u006d\u0020\u0070\u0065\u0072\u0063\u0065\u006e\u0074\u0061\u0067\u0065\u0020\u006f\u0066\u0020\u0074\u0068\u0065\u0020\u0068\u0065\u0061\u0072\u0074\u0062\u0065\u0061\u0074\u0020\u0070\u0061\