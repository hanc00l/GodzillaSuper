\u662f\u5426\u5f00\u542f\u9759\u6001\u0050\u0061\u0079\u006c\u006f\u0061\u0064=\u0057\u0068\u0065\u0074\u0068\u0065\u0072\u0020\u0074\u006f\u0020\u0065\u006e\u0061\u0062\u006c\u0065\u0020\u0073\u0074\u0061\u0074\u0069\u0063\u0020\u0050\u0061\u0079\u006c\u006f\u0061\u0064
\u662f\u5426\u7f16\u8bd1\u6210\u0043\u006c\u0061\u0073\u0073=\u0057\u0068\u0065\u0074\u0068\u0065\u0072\u0020\u0074\u006f\u0020\u0063\u006f\u006d\u0070\u0069\u006c\u0065\u0020\u0074\u006f\u0020\u0043\u006c\u0061\u0073\u0073
\u4e0d\u652f\u6301\u7684\u8fdc\u7a0b\u5bf9\u8c61\u0020\u006f\u0062\u006a\u003a\u0025\u0073=\u0055\u006e\u0073\u0075\u0070\u0070\u006f\u0072\u0074\u0065\u0064\u0020\u0072\u0065\u006d\u006f\u0074\u0065\u0020\u006f\u0062\u006a\u0065\u0063\u0074\u0020\u006f\u0062\u006a\u003a\u0025\u0073
\u542f\u52a8\u5931\u8d25\u0021=\u0046\u0061\u0069\u006c\u0065\u0064\u0020\u0074\u006f\u0020\u0073\u0074\u0061\u0072\u0074\u0021
\u5171\u0020\u0020\u0025\u0073\u0020\u004d\u0062=\u0054\u006f\u0074\u0061\u006c\u0020\u0025\u0073\u0020\u004d\u0062
