\u5982\u679c\u4f60\u4e0d\u77e5\u9053\u8fd9\u4e2a\u529f\u80fd\u662f\u505a\u4ec0\u4e48\u7684\u8bf7\u4e0d\u8981\u70b9\u51fb\u0021\u0020\u8fd9\u53ef\u80fd\u4f1a\u5f15\u8d77\u62d2\u7edd\u670d\u52a1\u0021=\u0049\u0066\u0020\u0079\u006f\u0075\u0020\u0064\u006f\u006e\u0027\u0074\u0020\u006b\u006e\u006f\u0077\u0020\u0077\u0068\u0061\u0074\u0020\u0074\u0068\u0069\u0073\u0020\u0066\u0075\u006e\u0063\u0074\u0069\u006f\u006e\u0020\u0064\u006f\u0065\u0073\u0020\u0070\u006c\u0065\u0061\u0073\u0065\u0020\u0064\u006f\u006e\u0027\u0074\u0020\u0063\u006c\u0069\u0063\u006b\u0020\u006f\u006e\u0020\u0069\u0074\u0021\u0020\u0054\u0068\u0069\u0073\u0020\u006d\u0061\u0079\u0020\u0063\u0061\u0075\u0073\u0065\u0020\u0061\u0020\u0064\u0065\u006e\u0069\u0061\u006c\u0020\u006f\u0066\u0020\u0073\u0065\u0072\u0076\u0069\u0063\u0065\u0021
\u627e\u4e0d\u5230\u6807\u8bb0\u0021=\u004e\u006f\u0020\u0074\u006f\u006b\u0065\u006e\u0020\u0066\u006f\u0075\u006e\u0064\u0021
\u7f16\u8bd1\u8fd4\u56de\u7a7a\u7684\u5185\u5bb9\u0021=\u0043\u006f\u006d\u0070\u0069\u006c\u0065\u0020\u0072\u0065\u0074\u0075\u0072\u006e\u0073\u0020\u0065\u006d\u0070\u0074\u0079\u0020\u0063\u006f\u006e\u0074\u0065\u006e\u0074\u0021
\u5f53\u524d\u0043\u0032\u0070\u0072\u006f\u0066\u0069\u006c\u0065\u003a\u0020\u0025\u0073=\u0043\u0075\u0072\u0072\u0065\u006e\u0074\u0020\u0043\u0032\u0070\u0072\u006f\u0066\u0069\u006c\u0065\u003a\u0020\u0025\u0073
\u53d1\u751f\u81f4\u547d\u9519\u8bef=\u0041\u0020\u0066\u0061\u0074\u0061\u006c\u0020\u0065\u0072\u0072\u006f\u0072\u0020\u006f\u0063\u0063\u0075\u0072\u0072\u0065\u0064
\u81ea\u5b9a\u4e49\u6a21\u677f\u540e\u7f00=\u0043\u0075\u0073\u0074\u006f\u006d\u0020\u0074\u0065\u006d\u0070\u006c\u0061\u0074\u0065\u0020\u0073\u0075\u0066\u0066\u0069\u0078
