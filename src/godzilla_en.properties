\u8bf7\u8f93\u5165\u6570\u636e\u5e93\u540d=\u0050\u006c\u0065\u0061\u0073\u0065\u0020\u0065\u006e\u0074\u0065\u0072\u0020\u0074\u0068\u0065\u0020\u0064\u0061\u0074\u0061\u0062\u0061\u0073\u0065\u0020\u006e\u0061\u006d\u0065
\u6dfb\u52a0\u5931\u8d25\u0020\u672a\u8f93\u5165\u6570\u636e\u5e93\u540d=\u0041\u0064\u0064\u0020\u0066\u0061\u0069\u006c\u0065\u0064\u0020\u004e\u006f\u0020\u0064\u0061\u0074\u0061\u0062\u0061\u0073\u0065\u0020\u006e\u0061\u006d\u0065\u0020\u0065\u006e\u0074\u0065\u0072\u0065\u0064
\u8b66\u544a\u005c\u0074\u5f53\u524d\u7248\u672c\u003a\u0025\u0073=\u0057\u0061\u0072\u006e\u0069\u006e\u0067\u0020\u005c\u0074\u0020\u0063\u0075\u0072\u0072\u0065\u006e\u0074\u0020\u0076\u0065\u0072\u0073\u0069\u006f\u006e\u003a\u0025\u0073
\u5bfc\u5165\u0043\u0032\u0050\u0072\u006f\u0066\u0069\u006c\u0065=\u0049\u006d\u0070\u006f\u0072\u0074\u0069\u006e\u0067\u0020\u0043\u0032\u0050\u0072\u006f\u0066\u0069\u006c\u0065
